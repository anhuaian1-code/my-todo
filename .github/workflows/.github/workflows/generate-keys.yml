name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore and Base64
        run: |
          # 这里是你的密码和别名
          STORE_PASS="123456"
          KEY_PASS="123456"
          ALIAS="mykey"
          
          keytool -genkeypair -v -keystore release.jks -alias $ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass $STORE_PASS -keypass $KEY_PASS -dname "CN=MobileUser, OU=Dev, O=Self, L=City, ST=State, C=CN"
          
          base64 -w 0 release.jks > keystore_base64.txt
          
          echo "==== YOUR INFO ===="
          echo "STORE_PASS: $STORE_PASS"
          echo "KEY_PASS: $KEY_PASS"
          echo "ALIAS: $ALIAS"
          echo "==================="
          
          mkdir output
          mv release.jks keystore_base64.txt output/

      - name: Upload Keys
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: output/
